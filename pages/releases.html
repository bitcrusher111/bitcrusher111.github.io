---
layout: default
title: Releases
permalink: /releases.html
# content: _data/releases.json (edit it in the site editor)
---
<div class="gallery gallery_releases">
  {% for release in site.data.releases.releases %}
    <a href="{{ release.url }}" class="gallery-item">
      <img src="{{ release.image }}" alt="{{ release.title }}" loading="lazy">
      <div class="overlay">{{ release.title }}</div>
    </a>
  {% endfor %}
</div>
