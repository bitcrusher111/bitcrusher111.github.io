# All works (solo works, theater, ongoing projects, other) live in _projects/.
# Their category decides where they appear; categories are set in _data/portfolio.json.
collections:
  projects:
    output: true

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

# build pages even if their date is in the future (otherwise they silently disappear)
future: true

exclude:
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - node_modules
  - bin
  - README.md
