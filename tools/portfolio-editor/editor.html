<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Anonymous+Pro:400,700&display=swap">
<style>
  :root {
    --bg: #f6f6f4;
    --panel: #ffffff;
    --fg: #111;
    --muted: #767676;
    --line: #e2e2de;
    --hover: #efefeb;
    --accent: #111;
    --accent-fg: #fff;
    --sel: #111;
    --sel-fg: #fff;
    --danger: #c0392b;
    --ok: #2e7d32;
    --warn: #b26a00;
    --drop: #3b82f6;
    --mono: "Anonymous Pro", ui-monospace, Menlo, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212; --panel: #1b1b1b; --fg: #eee; --muted: #9a9a9a;
      --line: #2e2e2e; --hover: #242424; --accent: #eee; --accent-fg: #111;
      --sel: #eee; --sel-fg: #111; --danger: #ef6b5b; --ok: #6cc070; --warn: #e0a040;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; display: grid; grid-template-rows: auto 1fr; }
  button { font: inherit; color: inherit; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button:hover { background: var(--hover); }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button.primary:hover { opacity: .85; }
  button.danger { color: var(--danger); }
  button.icon { padding: 4px 8px; }
  button:disabled { opacity: .4; cursor: default; }

  /* top bar */
  .topbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .topbar h1 { font-family: var(--mono); font-size: 16px; letter-spacing: .06em; text-transform: uppercase; margin-right: auto; }
  .status { font-size: 13px; color: var(--muted); }
  .status.dirty { color: var(--warn); }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--danger); }
  .topbar a { color: inherit; font-size: 13px; }

  .layout { display: grid; grid-template-columns: 290px 1fr; min-height: 0; }

  /* sidebar outline */
  .sidebar { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 10px 8px 40px; }
  .node { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 6px; cursor: pointer; user-select: none; border: 2px solid transparent; }
  .node:hover { background: var(--hover); }
  .node.selected { background: var(--sel); color: var(--sel-fg); }
  .node.page { font-family: var(--mono); font-weight: 700; margin-bottom: 8px; }
  .node.section { font-family: var(--mono); font-weight: 700; font-style: italic; text-transform: uppercase; font-size: 12px; margin-top: 10px; }
  .node.item { padding-left: 20px; }
  .node .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .year { color: var(--muted); font-size: 12px; }
  .node.selected .year { color: inherit; opacity: .7; }
  .node .grip { opacity: .35; cursor: grab; font-size: 12px; }
  .node.drop-before { border-top-color: var(--drop); }
  .node.drop-after { border-bottom-color: var(--drop); }
  .node.drop-into { border-color: var(--drop); }
  .node.dragging { opacity: .4; }
  .add-row { padding: 2px 8px 2px 20px; }
  .add-row button { border: none; color: var(--muted); padding: 4px 0; font-size: 13px; }
  .add-row button:hover { background: none; color: var(--fg); }
  .sidebar .add-section { margin: 16px 8px 0; width: calc(100% - 16px); }

  /* main */
  .main { overflow-y: auto; min-width: 0; }
  .main-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 12px 20px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .main-head .crumb { margin-right: auto; font-family: var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .main-head .crumb b { color: var(--fg); }
  .work { display: grid; grid-template-columns: minmax(340px, 1fr) minmax(320px, 1fr); gap: 24px; padding: 20px; align-items: start; }
  .work.single { grid-template-columns: minmax(340px, 720px); }

  /* form */
  .form { display: flex; flex-direction: column; gap: 18px; }
  fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--panel); display: flex; flex-direction: column; gap: 12px; }
  legend { font-family: var(--mono); font-weight: 700; text-transform: uppercase; font-size: 12px; letter-spacing: .06em; padding: 0 6px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .row { display: grid; grid-template-columns: 1fr 110px; gap: 10px; }
  input, textarea { font: inherit; font-size: 14px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
  input:focus, textarea:focus { outline: 2px solid var(--drop); outline-offset: -1px; }
  textarea { resize: vertical; min-height: 110px; line-height: 1.45; }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .hint.warn { color: var(--warn); }
  .hint code { font-size: 11px; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .list-entry { border: 1px dashed var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .list-entry-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
  .list-entry-head div { display: flex; gap: 4px; }
  .img-row { display: flex; gap: 8px; }
  .img-row input { flex: 1; }
  .empty { padding: 60px 20px; color: var(--muted); text-align: center; }

  /* preview — mirrors the site's .sw-item */
  .preview { position: sticky; top: 70px; background: #fff; color: #000; border: 1px solid var(--line); border-radius: 10px; padding: 18px; font-family: var(--mono); font-size: 15px; }
  .preview-label { font-family: var(--sans); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #888; margin-bottom: 12px; }
  .pv-media { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
  .pv-media iframe.video, .pv-media .ph { width: 100%; aspect-ratio: 16/9; border: 0; display: block; }
  .pv-media .ph { display: flex; align-items: center; justify-content: center; border: 1px dashed #aaa; color: grey; font-size: .9em; }
  .pv-media img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; }
  .pv-media iframe.bandcamp { width: 100%; height: 120px; border: 0; }
  .pv-media iframe.spotify { width: 100%; height: 152px; border: 0; border-radius: 12px; }
  .pv-title { font-size: 1.1em; font-weight: bold; }
  .pv-role { color: grey; font-size: .9em; margin-top: 2px; }
  .pv-text { line-height: 1.4; margin-top: 8px; }
  .pv-text a, .pv-links a { color: #000; }
  .pv-links { list-style: none; margin-top: 8px; }
  .pv-links a { text-decoration: none; }
  .pv-section { font-weight: bold; font-style: italic; text-transform: uppercase; }
  .pv-page-title { font-size: 1.6em; font-weight: bold; letter-spacing: .08em; margin-bottom: 10px; }
  .pv-skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px 20px; margin-top: 8px; }
  .pv-skills b { display: block; margin-bottom: 4px; }
  .pv-skills ul { list-style: none; line-height: 1.5; }
  .pv-block { margin-top: 24px; }

  /* skills form */
  .skill-group { border: 1px dashed var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .skill-group-head { display: flex; gap: 6px; align-items: center; }
  .skill-group-head input { flex: 1; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); cursor: text; }
  .chips:focus-within { outline: 2px solid var(--drop); outline-offset: -1px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 9px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; cursor: grab; }
  .chip.dragging { opacity: .4; }
  .chip button { border: none; padding: 0 5px; border-radius: 999px; line-height: 1.2; color: var(--muted); }
  .chip button:hover { color: var(--danger); background: none; }
  .chips input { flex: 1; min-width: 140px; border: none; background: none; padding: 4px; outline: none; }

  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--accent-fg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }

  @media (max-width: 1100px) { .work { grid-template-columns: 1fr; } .preview { position: static; } }
  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--line); }
    .topbar { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<header class="topbar">
  <h1>Portfolio Editor</h1>
  <span class="status" id="status">Loading…</span>
  <a href="http://localhost:4000/selected-works/" target="_blank" rel="noopener">View page ↗</a>
  <button id="revert" title="Discard unsaved changes">Revert</button>
  <button id="save" class="primary" title="Save (⌘S)">Save</button>
</header>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const PLACEHOLDER = "Example text: a short description of the project.";
let data = null;
let selected = "page";   // "page" | section object | item object
let dirty = false;
let drag = null;

const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };

/* ---------- URL helpers: accept whatever gets pasted ---------- */
function srcFromIframe(s) {
  const m = String(s).match(/<iframe[^>]*\ssrc=["']([^"']+)["']/i);
  return m ? m[1].replace(/&amp;/g, "&") : String(s).trim();
}
function toVideoEmbed(input) {
  const s = srcFromIframe(input);
  if (!s) return "";
  let u; try { u = new URL(s); } catch { return s; }
  const host = u.hostname.replace(/^www\.|^m\./, "");
  if (host === "youtu.be") return "https://www.youtube.com/embed/" + u.pathname.slice(1).split("/")[0];
  if (host.endsWith("youtube.com") || host.endsWith("youtube-nocookie.com")) {
    const v = u.searchParams.get("v");
    if (v) return "https://www.youtube.com/embed/" + v;
    const m = u.pathname.match(/^\/(?:embed|shorts|live|v)\/([\w-]+)/);
    if (m) return "https://www.youtube.com/embed/" + m[1];
  }
  if (host === "vimeo.com" || host === "player.vimeo.com") {
    const m = u.pathname.match(/(?:\/video)?\/(\d+)(?:\/([0-9a-f]+))?/);
    if (m) {
      const hash = u.searchParams.get("h") || m[2];
      return "https://player.vimeo.com/video/" + m[1] + (hash ? "?h=" + hash : "");
    }
  }
  return s;
}
function toSpotifyEmbed(input) {
  const s = srcFromIframe(input);
  const m = s.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(?:embed\/)?(track|album|playlist|episode|show|artist)\/([A-Za-z0-9]+)/);
  return m ? `https://open.spotify.com/embed/${m[1]}/${m[2]}` : s;
}
function parseBandcamp(input) {
  const s = String(input);
  const src = srcFromIframe(s);
  const a = s.match(/<a[^>]*href=["']([^"']+)["'][^>]*>([^<]*)<\/a>/i);
  return { src, url: a ? a[1] : "", label: a ? a[2].trim() : "" };
}
function videoNote(url) {
  if (!url) return "";
  if (/youtube\.com\/embed\/|player\.vimeo\.com\/video\//.test(url)) return "";
  return "This doesn't look like a YouTube or Vimeo link — the player may not work.";
}

/* ---------- data helpers ---------- */
function locate(obj) {
  for (let s = 0; s < data.sections.length; s++) {
    if (data.sections[s] === obj) return { s };
    const i = data.sections[s].items.indexOf(obj);
    if (i >= 0) return { s, i };
  }
  return null;
}
function newItem() { return { title: "New piece", year: "", role: "", text: "", embed: "", links: [] }; }
function cleanForSave(d) {
  const out = JSON.parse(JSON.stringify(d));
  out.socials = (out.socials || []).filter(l => l.url);
  out.skills = (out.skills || []).map(g => ({ title: (g.title || "").trim(), items: (g.items || []).filter(Boolean) })).filter(g => g.title || g.items.length);
  if (!out.skills_title) delete out.skills_title;
  for (const sec of out.sections) {
    sec.items = sec.items.map(it => {
      const o = { title: it.title || "", year: it.year || "", role: it.role || "", text: it.text || "" };
      for (const k of ["page", "image", "embed"]) if (it[k]) o[k] = it[k];
      for (const k of ["bandcamp", "spotify"]) {
        const list = (it[k] || []).filter(p => p.src);
        if (list.length) o[k] = list;
      }
      o.links = (it.links || []).filter(l => l.url);
      return o;
    });
  }
  return out;
}

/* ---------- status / saving ---------- */
function setStatus(text, cls = "") { const el = $("#status"); el.textContent = text; el.className = "status " + cls; }
function markDirty() { dirty = true; setStatus("Unsaved changes", "dirty"); }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 1800); }

async function load() {
  const r = await fetch("/api/data");
  data = await r.json();
  data.sections.forEach(s => s.items.forEach(it => { it.links ||= []; }));
  dirty = false;
  setStatus("All changes saved", "ok");
  if (selected !== "page" && !locate(selected)) selected = "page";
  renderSidebar(); renderMain();
}
async function save() {
  setStatus("Saving…");
  try {
    const r = await fetch("/api/data", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cleanForSave(data)) });
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    dirty = false;
    setStatus("All changes saved", "ok");
    toast("Saved — the page updates in a few seconds");
  } catch (e) {
    setStatus("Save failed: " + e.message, "err");
  }
}

/* ---------- sidebar ---------- */
function renderSidebar() {
  const sb = $("#sidebar");
  sb.innerHTML = "";
  const page = h(`<div class="node page ${selected === "page" ? "selected" : ""}"><span class="label">Page title & intro</span></div>`);
  page.onclick = () => select("page");
  sb.append(page);

  data.sections.forEach((sec, s) => {
    const sn = h(`<div class="node section ${selected === sec ? "selected" : ""}" draggable="true"><span class="grip">⋮⋮</span><span class="label">${esc(sec.title || "untitled section")}</span></div>`);
    sn.onclick = () => select(sec);
    wireDrag(sn, { kind: "section", s });
    sb.append(sn);

    sec.items.forEach((it, i) => {
      const n = h(`<div class="node item ${selected === it ? "selected" : ""}" draggable="true"><span class="grip">⋮⋮</span><span class="label">${esc(it.title || "untitled")}</span><span class="year">${esc(it.year || "")}</span></div>`);
      n.onclick = () => select(it);
      wireDrag(n, { kind: "item", s, i });
      sb.append(n);
    });

    const add = h(`<div class="add-row"><button>+ add piece</button></div>`);
    add.firstElementChild.onclick = () => { const it = newItem(); sec.items.push(it); markDirty(); select(it); $("#f-title")?.select(); };
    sb.append(add);
  });

  const addSec = h(`<button class="add-section">+ add section</button>`);
  addSec.onclick = () => { const sec = { title: "new section", items: [] }; data.sections.push(sec); markDirty(); select(sec); $("#f-sectitle")?.select(); };
  sb.append(addSec);
}

function wireDrag(el, pos) {
  el.addEventListener("dragstart", e => { drag = pos; el.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", ""); });
  el.addEventListener("dragend", () => { drag = null; renderSidebar(); });
  el.addEventListener("dragover", e => {
    if (!drag) return;
    const where = dropWhere(el, pos, e);
    if (!where) return;
    e.preventDefault();
    el.classList.remove("drop-before", "drop-after", "drop-into");
    el.classList.add("drop-" + where);
  });
  el.addEventListener("dragleave", () => el.classList.remove("drop-before", "drop-after", "drop-into"));
  el.addEventListener("drop", e => {
    e.preventDefault();
    const where = dropWhere(el, pos, e);
    if (where) move(drag, pos, where);
  });
}
function dropWhere(el, target, e) {
  const r = el.getBoundingClientRect();
  const after = e.clientY > r.top + r.height / 2;
  if (drag.kind === "section") return target.kind === "section" && target.s !== drag.s ? (after ? "after" : "before") : null;
  if (target.kind === "section") return "into";
  if (target.s === drag.s && target.i === drag.i) return null;
  return after ? "after" : "before";
}
function move(from, to, where) {
  if (from.kind === "section") {
    const [sec] = data.sections.splice(from.s, 1);
    let idx = data.sections.indexOf(data.sections[to.s > from.s ? to.s - 1 : to.s]);
    data.sections.splice(where === "after" ? idx + 1 : idx, 0, sec);
  } else {
    const targetSec = data.sections[to.s];
    const targetItem = to.kind === "item" ? targetSec.items[to.i] : null;
    const [it] = data.sections[from.s].items.splice(from.i, 1);
    if (!targetItem) targetSec.items.unshift(it);
    else {
      const idx = targetSec.items.indexOf(targetItem);
      targetSec.items.splice(where === "after" ? idx + 1 : idx, 0, it);
    }
  }
  markDirty(); renderSidebar(); renderMain();
}

function select(obj) { selected = obj; renderSidebar(); renderMain(); }

/* ---------- main pane ---------- */
function renderMain() {
  const main = $("#main");
  main.innerHTML = "";
  if (selected === "page") return renderPage(main);
  const loc = locate(selected);
  if (!loc) return;
  if (loc.i === undefined) renderSection(main, loc.s);
  else renderItem(main, loc.s, loc.i);
}

function headBar(crumb, { up, down, del, extra = [] }) {
  const bar = h(`<div class="main-head"><div class="crumb">${crumb}</div></div>`);
  const btn = (txt, title, fn, cls = "icon") => { const b = h(`<button class="${cls}" title="${title}">${txt}</button>`); if (fn) b.onclick = fn; else b.disabled = true; bar.append(b); };
  extra.forEach(x => btn(...x));
  btn("↑", "Move up", up);
  btn("↓", "Move down", down);
  btn("Delete", "Delete", del, "danger");
  return bar;
}

function field(label, value, onInput, { id = "", type = "input", placeholder = "", hint = "" } = {}) {
  const el = h(`<label>${esc(label)}${type === "textarea" ? `<textarea id="${id}" placeholder="${esc(placeholder)}"></textarea>` : `<input id="${id}" placeholder="${esc(placeholder)}">`}${hint ? `<span class="hint">${hint}</span>` : ""}</label>`);
  const inp = el.querySelector("input,textarea");
  inp.value = value ?? "";
  inp.addEventListener("input", () => { onInput(inp.value, inp); markDirty(); });
  return el;
}

function renderPage(main) {
  main.append(h(`<div class="main-head"><div class="crumb"><b>Page</b></div></div>`));
  const work = h(`<div class="work"><div class="form"></div><div class="preview"></div></div>`);
  const form = work.firstElementChild, pv = work.lastElementChild;
  const fs = h(`<fieldset><legend>Page</legend></fieldset>`);
  data.skills ||= [];
  const upd = () => {
    const groups = data.skills.filter(g => g.title || g.items.length);
    pv.innerHTML = `<div class="preview-label">Preview</div><div class="pv-page-title">${esc(data.title)}</div><p class="pv-text">${data.subtitle || ""}</p>`
      + (groups.length ? `<div class="pv-block"><div class="pv-section">// ${esc(data.skills_title || "skills")}</div><div class="pv-skills">${groups.map(g => `<div>${g.title ? `<b>${esc(g.title)}</b>` : ""}<ul>${g.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div></div>` : "");
  };
  fs.append(field("Title", data.title, v => { data.title = v; upd(); }));
  fs.append(field("Intro text", data.subtitle, v => { data.subtitle = v; upd(); }, { type: "textarea", hint: "You can use simple HTML, e.g. <code>&lt;a href=\"https://…\"&gt;link&lt;/a&gt;</code>" }));
  form.append(fs);
  form.append(skillsEditor(upd));
  form.append(listEditor("Social links", data, "socials", [["label", "Text", null], ["url", "URL"]], "Shown as text links at the bottom of the page, e.g. instagram, youtube.", () => {}));
  main.append(work); upd();
}

function renderSection(main, s) {
  const sec = data.sections[s];
  main.append(headBar(`Section · <b>${esc(sec.title)}</b>`, {
    up: s > 0 ? () => { data.sections.splice(s - 1, 0, data.sections.splice(s, 1)[0]); markDirty(); select(sec); } : null,
    down: s < data.sections.length - 1 ? () => { data.sections.splice(s + 1, 0, data.sections.splice(s, 1)[0]); markDirty(); select(sec); } : null,
    del: () => {
      if (!confirm(`Delete the section "${sec.title}"${sec.items.length ? ` and its ${sec.items.length} piece(s)` : ""}?`)) return;
      data.sections.splice(s, 1); markDirty(); select("page");
    },
  }));
  const work = h(`<div class="work single"><div class="form"></div></div>`);
  const fs = h(`<fieldset><legend>Section</legend></fieldset>`);
  fs.append(field("Section title", sec.title, v => { sec.title = v; renderSidebar(); }, { id: "f-sectitle", hint: "Shown as “// TITLE” on the page." }));
  fs.append(field("Description (optional)", sec.text, v => { sec.text = v; }, { type: "textarea", placeholder: "A general text about this area of work, shown below the section title.", hint: "Simple HTML works, e.g. <code>&lt;em&gt;</code> or <code>&lt;a href=\"…\"&gt;</code>." }));
  fs.append(h(`<p class="hint">${sec.items.length} piece(s). Drag pieces in the sidebar to reorder them or move them between sections.</p>`));
  const add = h(`<button>+ add piece to this section</button>`);
  add.onclick = () => { const it = newItem(); sec.items.push(it); markDirty(); select(it); };
  fs.append(add);
  work.firstElementChild.append(fs);
  main.append(work);
}

function renderItem(main, s, i) {
  const sec = data.sections[s], it = sec.items[i];
  const moveTo = (ns, ni) => { sec.items.splice(i, 1); data.sections[ns].items.splice(ni, 0, it); markDirty(); select(it); };
  main.append(headBar(`${esc(sec.title)} / <b>${esc(it.title)}</b>`, {
    up: i > 0 ? () => moveTo(s, i - 1) : s > 0 ? () => moveTo(s - 1, data.sections[s - 1].items.length) : null,
    down: i < sec.items.length - 1 ? () => moveTo(s, i + 1) : s < data.sections.length - 1 ? () => moveTo(s + 1, 0) : null,
    del: () => { if (!confirm(`Delete "${it.title}"?`)) return; sec.items.splice(i, 1); markDirty(); select(sec); },
    extra: [["Duplicate", "Duplicate this piece", () => { const c = JSON.parse(JSON.stringify(it)); c.title += " (copy)"; sec.items.splice(i + 1, 0, c); markDirty(); select(c); }, ""]],
  }));

  const work = h(`<div class="work"><div class="form"></div><div class="preview"><div class="preview-label">Preview</div><div class="pv-media"></div><div class="pv-info"></div></div></div>`);
  const form = work.firstElementChild;
  const pvMedia = $(".pv-media", work), pvInfo = $(".pv-info", work);

  const updInfo = () => {
    const links = [];
    if (it.page) links.push(`<li><a href="http://localhost:4000${esc(it.page)}" target="_blank">→ full documentation</a></li>`);
    (it.links || []).filter(l => l.url).forEach(l => links.push(`<li><a href="${esc(l.url)}" target="_blank" rel="noopener">→ ${esc(l.label || l.url)}</a></li>`));
    pvInfo.innerHTML = `<div class="pv-title">${esc(it.title)}${it.year ? ` (${esc(it.year)})` : ""}</div>`
      + (it.role ? `<p class="pv-role">${esc(it.role)}</p>` : "")
      + (it.text ? `<p class="pv-text">${it.text}</p>` : "")
      + (links.length ? `<ul class="pv-links">${links.join("")}</ul>` : "");
  };
  const updMedia = () => {
    let m = "";
    if (it.image) m += `<img src="${esc(it.image)}" alt="">`;
    if (it.embed) m += `<iframe class="video" src="${esc(it.embed)}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
    (it.bandcamp || []).filter(p => p.src).forEach(p => m += `<iframe class="bandcamp" src="${esc(p.src)}" seamless></iframe>`);
    (it.spotify || []).filter(p => p.src).forEach(p => m += `<iframe class="spotify" src="${esc(p.src)}" allow="encrypted-media" loading="lazy"></iframe>`);
    pvMedia.innerHTML = m || `<div class="ph">video / photo / audio</div>`;
  };
  // media previews reload iframes, so refresh them only after a pause in typing
  let mt; const updMediaSoon = () => { clearTimeout(mt); mt = setTimeout(updMedia, 600); };

  /* text */
  const info = h(`<fieldset><legend>Text</legend></fieldset>`);
  const row = h(`<div class="row"></div>`);
  row.append(field("Title", it.title, v => { it.title = v; updInfo(); renderSidebar(); $(".crumb b").textContent = v; }, { id: "f-title" }));
  row.append(field("Year", it.year, v => { it.year = v; updInfo(); renderSidebar(); }, { placeholder: "2026" }));
  info.append(row);
  info.append(field("Role", it.role, v => { it.role = v; updInfo(); }, { placeholder: "composition, sound design" }));
  const isPlaceholder = (it.text || "").startsWith(PLACEHOLDER);
  info.append(field("Description", it.text, v => { it.text = v; updInfo(); }, {
    type: "textarea",
    placeholder: "What is it, what was your role, where and when was it shown?",
    hint: (isPlaceholder ? `<span class="hint warn">Still the placeholder text.</span> ` : "") + "Simple HTML works, e.g. <code>&lt;em&gt;</code> or <code>&lt;a href=\"…\"&gt;</code>.",
  }));
  form.append(info);

  /* video + image */
  const media = h(`<fieldset><legend>Video & image</legend></fieldset>`);
  const vNote = h(`<span class="hint warn"></span>`);
  const vField = field("Video (YouTube or Vimeo)", it.embed, v => { it.embed = v.trim(); vNote.textContent = videoNote(it.embed); updMediaSoon(); },
    { placeholder: "Paste any YouTube/Vimeo link", hint: "Paste a normal link like youtube.com/watch?v=… or vimeo.com/123… — it's converted automatically." });
  const vInput = $("input", vField);
  vInput.addEventListener("change", () => { const e = toVideoEmbed(vInput.value); if (e !== vInput.value) { vInput.value = e; it.embed = e; toast("Converted to an embed link"); } vNote.textContent = videoNote(it.embed); updMedia(); });
  vField.append(vNote); vNote.textContent = videoNote(it.embed);
  media.append(vField);

  const imgLabel = h(`<label>Image<div class="img-row"><input placeholder="/assets/images/…"><button type="button">Upload…</button><input type="file" accept="image/*" hidden></div><span class="hint">Shown above the video. Uploads go to assets/images/selected-works/.</span></label>`);
  const [imgInput, fileInput] = imgLabel.querySelectorAll("input");
  imgInput.value = it.image || "";
  imgInput.addEventListener("input", () => { it.image = imgInput.value.trim(); markDirty(); updMediaSoon(); });
  $("button", imgLabel).onclick = e => { e.preventDefault(); fileInput.click(); };
  fileInput.onchange = async () => {
    const f = fileInput.files[0]; if (!f) return;
    toast("Uploading…");
    const r = await fetch("/api/upload?name=" + encodeURIComponent(f.name), { method: "POST", body: f });
    const j = await r.json();
    if (!r.ok) return toast("Upload failed: " + j.error);
    it.image = imgInput.value = j.url; markDirty(); updMedia(); toast("Image uploaded");
  };
  media.append(imgLabel);
  form.append(media);

  /* audio players + links */
  form.append(listEditor("Bandcamp players", it, "bandcamp", [
    ["src", "Player URL or full embed code", v => { if (/<iframe/i.test(v)) return parseBandcamp(v); return null; }],
    ["label", "Label"], ["url", "Album URL"],
  ], "Paste Bandcamp's full embed code (Share / Embed) into the first field — the rest fills itself.", updMediaSoon));
  form.append(listEditor("Spotify players", it, "spotify", [
    ["src", "Spotify link", v => { const e = toSpotifyEmbed(v); return e !== v ? { src: e } : null; }],
    ["label", "Label"],
  ], "Paste a normal open.spotify.com link to a track, album or playlist.", updMediaSoon));
  form.append(listEditor("Links", it, "links", [["label", "Label"], ["url", "URL"]], "Shown as “→ label” below the text.", updInfo));

  const pageFs = h(`<fieldset><legend>Page on this website</legend></fieldset>`);
  pageFs.append(field("Path", it.page, v => { it.page = v.trim(); updInfo(); }, { placeholder: "/theater/gott/", hint: "Adds a “→ full documentation” link." }));
  form.append(pageFs);

  main.append(work);
  updInfo(); updMedia();
}

/* skills: groups with a name and a list of tags */
function skillsEditor(onChange) {
  const fs = h(`<fieldset><legend>Skills</legend><p class="hint">Shown after the intro text. Make groups (e.g. composition, sound design, technical) and type each skill, then press Enter. Paste a comma-separated list to add many at once. Drag tags to reorder them.</p></fieldset>`);
  fs.append(field("Heading", data.skills_title || "", v => { data.skills_title = v; onChange(); }, { placeholder: "skills", hint: "Shown as “// heading”. Leave empty for “skills”." }));
  const wrap = h(`<div class="list"></div>`);
  fs.append(wrap);
  const changed = () => { markDirty(); onChange(); };

  const draw = (focusGroup = -1) => {
    wrap.innerHTML = "";
    data.skills.forEach((g, n) => {
      g.items ||= [];
      const box = h(`<div class="skill-group"><div class="skill-group-head"><input placeholder="Group name, e.g. composition"></div><div class="chips"></div></div>`);
      const title = $("input", box);
      title.value = g.title || "";
      title.addEventListener("input", () => { g.title = title.value; changed(); });
      const head = $(".skill-group-head", box);
      const mk = (t, tip, fn, cls = "icon") => { const b = h(`<button class="${cls}" title="${tip}">${t}</button>`); if (fn) b.onclick = fn; else b.disabled = true; head.append(b); };
      mk("↑", "Move group up", n > 0 ? () => { data.skills.splice(n - 1, 0, data.skills.splice(n, 1)[0]); changed(); draw(); } : null);
      mk("↓", "Move group down", n < data.skills.length - 1 ? () => { data.skills.splice(n + 1, 0, data.skills.splice(n, 1)[0]); changed(); draw(); } : null);
      mk("Remove", "Remove group", () => { if (g.items.length && !confirm(`Remove the group "${g.title || "untitled"}" and its ${g.items.length} skill(s)?`)) return; data.skills.splice(n, 1); changed(); draw(); }, "icon danger");

      const chips = $(".chips", box);
      const input = h(`<input placeholder="type a skill, press Enter">`);
      let dragFrom = null;
      const drawChips = () => {
        chips.querySelectorAll(".chip").forEach(c => c.remove());
        g.items.forEach((skill, k) => {
          const chip = h(`<span class="chip" draggable="true">${esc(skill)}<button title="Remove">×</button></span>`);
          $("button", chip).onclick = e => { e.stopPropagation(); g.items.splice(k, 1); changed(); drawChips(); input.focus(); };
          chip.addEventListener("dragstart", e => { dragFrom = k; chip.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", ""); });
          chip.addEventListener("dragend", () => { dragFrom = null; drawChips(); });
          chip.addEventListener("dragover", e => { if (dragFrom !== null) e.preventDefault(); });
          chip.addEventListener("drop", e => { e.preventDefault(); if (dragFrom === null || dragFrom === k) return; g.items.splice(k, 0, g.items.splice(dragFrom, 1)[0]); changed(); drawChips(); });
          chips.insertBefore(chip, input);
        });
      };
      const add = text => {
        const parts = text.split(/[,\n]/).map(t => t.trim()).filter(Boolean);
        if (!parts.length) return;
        g.items.push(...parts); input.value = ""; changed(); drawChips();
      };
      input.addEventListener("keydown", e => {
        if (e.key === "Enter" || (e.key === "," && !e.isComposing)) { e.preventDefault(); add(input.value); }
        else if (e.key === "Backspace" && !input.value && g.items.length) { input.value = g.items.pop(); changed(); drawChips(); e.preventDefault(); }
      });
      input.addEventListener("paste", e => { const t = e.clipboardData.getData("text"); if (/[,\n]/.test(t)) { e.preventDefault(); add(input.value + t); } });
      input.addEventListener("blur", () => add(input.value));
      chips.append(input);
      chips.onclick = e => { if (e.target === chips) input.focus(); };
      drawChips();
      wrap.append(box);
      if (n === focusGroup) title.focus();
    });
    const addBtn = h(`<button>+ add skill group</button>`);
    addBtn.onclick = () => { data.skills.push({ title: "", items: [] }); changed(); draw(data.skills.length - 1); };
    wrap.append(addBtn);
  };
  draw();
  return fs;
}

/* generic editor for a list of small objects (players, links) */
function listEditor(title, it, key, fields, hint, onChange) {
  it[key] ||= [];
  const fs = h(`<fieldset><legend>${esc(title)}</legend><p class="hint">${hint}</p><div class="list"></div></fieldset>`);
  const list = $(".list", fs);
  const draw = () => {
    list.innerHTML = "";
    it[key].forEach((entry, n) => {
      const box = h(`<div class="list-entry"><div class="list-entry-head"><span>#${n + 1}</span><div></div></div></div>`);
      const btns = $(".list-entry-head div", box);
      const mk = (t, fn, cls = "icon") => { const b = h(`<button class="${cls}">${t}</button>`); if (fn) b.onclick = fn; else b.disabled = true; btns.append(b); };
      mk("↑", n > 0 ? () => { it[key].splice(n - 1, 0, it[key].splice(n, 1)[0]); markDirty(); draw(); onChange(); } : null);
      mk("↓", n < it[key].length - 1 ? () => { it[key].splice(n + 1, 0, it[key].splice(n, 1)[0]); markDirty(); draw(); onChange(); } : null);
      mk("Remove", () => { it[key].splice(n, 1); markDirty(); draw(); onChange(); }, "icon danger");
      fields.forEach(([k, label, transform]) => {
        const f = field(label, entry[k], v => { entry[k] = v; onChange(); });
        if (transform) $("input", f).addEventListener("change", e => {
          const res = transform(e.target.value);
          if (res) { Object.entries(res).forEach(([rk, rv]) => { if (rv || rk === k) entry[rk] = rv; }); markDirty(); draw(); onChange(); toast("Converted"); }
        });
        box.append(f);
      });
      list.append(box);
    });
    const add = h(`<button>+ add</button>`);
    add.onclick = () => { it[key].push(Object.fromEntries(fields.map(([k]) => [k, ""]))); markDirty(); draw(); list.lastElementChild.previousElementSibling?.querySelector("input")?.focus(); };
    list.append(add);
  };
  draw();
  return fs;
}

/* ---------- global ---------- */
$("#save").onclick = save;
$("#revert").onclick = () => { if (!dirty || confirm("Discard all unsaved changes?")) load(); };
document.addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); save(); } });
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
load().catch(e => setStatus("Could not load data: " + e.message, "err"));
</script>
